name: LifeAdmin
options:
  bundleIdPrefix: com.lifeadmin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  LifeAdminCore:
    path: .

targets:
  LifeAdminApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifeAdminApp
    dependencies:
      - package: LifeAdminCore
        product: LifeAdminCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeadmin.app
        PRODUCT_NAME: "Life Admin"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Life Admin"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Life Admin uses the camera to scan documents and receipts you choose to add."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Life Admin can use Face ID to keep your bills and insurance details private if someone else picks up your phone."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Life Admin can add reminders and due dates to your calendar."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Life Admin can add reminders and due dates to your calendar."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Life Admin can create reminders for items with due dates."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Life Admin can create reminders for items with due dates."

schemes:
  LifeAdminApp:
    build:
      targets:
        LifeAdminApp: all
    run:
      config: Debug
